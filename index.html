const sanitizeInput = (str) => {
  if (typeof str !== 'string') return '';
  return str
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;")
    .trim();
};

class ErrorBoundary extends Component {
  state = { hasError: false };
  static getDerivedStateFromError() { return { hasError: true }; }
  componentDidCatch(error, info) { console.error("ErrorBoundary:", error, info); }
  render() {
    if (this.state.hasError) {
      return (
        <div className="min-h-screen flex items-center justify-center bg-[#faf8f6] p-6 text-center">
          <div className="max-w-md bg-white p-8 rounded-3xl border border-[#eadece] shadow-xl">
            <h2 className="font-serif text-2xl text-[#1a1a1a] mb-3">Algo salió mal</h2>
            <p className="text-sm text-[#666] mb-6">Hemos encontrado un inconveniente temporal cargando la aplicación. Por favor recarga la página.</p>
            <button onClick={() => window.location.reload()} className="bg-[#1c1c1c] text-white px-8 py-3 rounded-full text-xs uppercase tracking-widest">Recargar Sitio</button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

function App() {
  const [activeTab, setActiveTab] = useState('home');
  const [selectedCategory, setSelectedCategory] = useState('all');
  const [searchQuery, setSearchQuery] = useState('');
  const [isSearchOpen, setIsSearchOpen] = useState(false);
  const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
  const [currentProduct, setCurrentProduct] = useState(INITIAL_PRODUCTS[0]);
  const [selectedColor, setSelectedColor] = useState('');
  const [selectedSize, setSelectedSize] = useState('');
  const [selectedPresentation, setSelectedPresentation] = useState('');
  const [productQuantity, setProductQuantity] = useState(1);
  const [customMessage, setCustomMessage] = useState('');
  const [recipientName, setRecipientName] = useState('');
  const [selectedOccasion, setSelectedOccasion] = useState('Cumpleaños');

  const [reviews, setReviews] = useState(() => {
    try {
      const saved = localStorage.getItem('bloombela_reviews');
      return saved ? JSON.parse(saved) : [];
    } catch { return []; }
  });
  const [newReviewName, setNewReviewName] = useState('');
  const [newReviewComment, setNewReviewComment] = useState('');
  const [newReviewRating, setNewReviewRating] = useState(5);
  const [reviewSuccessMessage, setReviewSuccessMessage] = useState(false);

  const [cart, setCart] = useState(() => {
    try {
      const saved = localStorage.getItem('bloombela_cart');
      return saved ? JSON.parse(saved) : [];
    } catch { return []; }
  });
  const [isCartOpen, setIsCartOpen] = useState(false);
  const [isCheckoutOpen, setIsCheckoutOpen] = useState(false);
  const [checkoutForm, setCheckoutForm] = useState({
    fullName: '',
    whatsapp: '',
    address: '',
    neighborhood: '',
    reference: '',
    deliveryDate: '',
    timeSlot: 'Mañana (9:00 a.m. - 1:00 p.m.)',
    note: '',
    paymentMethod: `Nequi (${CONFIG.NEQUI_NUMBER})`
  });

  useEffect(() => {
    try { localStorage.setItem('bloombela_cart', JSON.stringify(cart)); }
    catch (e) { console.error("Storage error:", e); }
  }, [cart]);

  useEffect(() => {
    try { localStorage.setItem('bloombela_reviews', JSON.stringify(reviews)); }
    catch (e) { console.error("Storage error:", e); }
  }, [reviews]);

  useEffect(() => {
    if (currentProduct && currentProduct.variants) {
      setSelectedColor(currentProduct.variants.colors?.[0] || '');
      setSelectedSize(currentProduct.variants.sizes?.[0] || '');
      setSelectedPresentation(currentProduct.variants.presentations?.[0] || '');
    }
    setProductQuantity(1);
  }, [currentProduct]);

  const cartSubtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
  const shippingTotal = CONFIG.DELIVERY_PRICE;
  const cartTotal = cartSubtotal + shippingTotal;
  const totalCartCount = cart.reduce((sum, item) => sum + item.quantity, 0);

  const addToCart = (product, quantity = 1, options = {}) => {
    const newItem = {
      cartId: `${product.id}-${options.color || selectedColor || 'def'}-${options.size || selectedSize || 'def'}-${options.presentation || selectedPresentation || 'def'}-${Date.now()}`,
      productId: sanitizeInput(product.id),
      name: sanitizeInput(product.name),
      price: product.price,
      formattedPrice: product.formattedPrice,
      category: sanitizeInput(product.category),
      quantity,
      color: sanitizeInput(options.color || selectedColor),
      size: sanitizeInput(options.size || selectedSize),
      presentation: sanitizeInput(options.presentation || selectedPresentation),
      recipientName: sanitizeInput(options.recipientName || recipientName),
      customMessage: sanitizeInput(options.customMessage || customMessage),
      occasion: sanitizeInput(options.occasion || selectedOccasion)
    };
    setCart(prev => [...prev, newItem]);
    setIsCartOpen(true);
  };

  const removeFromCart = (cartId) => setCart(prev => prev.filter(item => item.cartId !== cartId));

  const updateCartQuantity = (cartId, delta) => {
    setCart(prev => prev.map(item => {
      if (item.cartId === cartId) {
        const newQty = item.quantity + delta;
        return newQty > 0 ? { ...item, quantity: newQty } : null;
      }
      return item;
    }).filter(Boolean));
  };

  const handleAddReview = (e) => {
    e.preventDefault();
    const cleanName = sanitizeInput(newReviewName);
    const cleanComment = sanitizeInput(newReviewComment);
    if (!cleanName || !cleanComment) return;
    const reviewObj = { id: Date.now(), name: cleanName, comment: cleanComment, rating: Number(newReviewRating), date: "Hace un momento" };
    setReviews([reviewObj, ...reviews]);
    setNewReviewName('');
    setNewReviewComment('');
    setReviewSuccessMessage(true);
    setTimeout(() => setReviewSuccessMessage(false), 4000);
  };

  const handleWhatsAppCheckout = (e) => {
    if (e) e.preventDefault();
    const itemsText = cart.map(item =>
      `• ${item.name} (Cant: ${item.quantity}) - ${item.formattedPrice}\n  Color: ${item.color || 'N/A'} | Tamaño: ${item.size || 'N/A'} | Presentación: ${item.presentation || 'N/A'}${item.recipientName ? `\n  Para: ${item.recipientName} (${item.occasion})\n  Mensaje: "${item.customMessage}"` : ''}`
    ).join('\n\n');
    const form = checkoutForm;
    const message = `Hola ${CONFIG.BUSINESS_NAME}, quiero realizar el siguiente pedido con entrega en Rionegro:\n\n` +
      `*PRODUCTOS:*\n${itemsText}\n\n` +
      `*Subtotal:* $${cartSubtotal.toLocaleString()}\n` +
      `*Envío en Rionegro:* $${shippingTotal.toLocaleString()}\n` +
      `*TOTAL A PAGAR:* $${cartTotal.toLocaleString()}\n\n` +
      `*DATOS DE ENTREGA:*\n` +
      `• Nombre: ${sanitizeInput(form.fullName) || 'No especificado'}\n` +
      `• WhatsApp: ${sanitizeInput(form.whatsapp) || 'No especificado'}\n` +

                <div>
                  <label className="block text-xs uppercase tracking-wider text-[#666] mb-2 font-medium">Dirección de Entrega *</label>
                  <input type="text" required placeholder="Calle, número, Edificio" value={checkoutForm.address} onChange={(e) => setCheckoutForm({ ...checkoutForm, address: e.target.value })} className="w-full bg-white border border-[#eadece] rounded-2xl px-5 py-3.5 text-sm outline-none focus:border-[#b3707b]" />
                </div>
                <div>
                  <label className="block text-xs uppercase tracking-wider text-[#666] mb-2 font-medium">Barrio / Sector en Rionegro *</label>
                  <input type="text" required placeholder="Ej. San Antonio, Porvenir, Centro, Llanogrande" value={checkoutForm.neighborhood} onChange={(e) => setCheckoutForm({ ...checkoutForm, neighborhood: e.target.value })} className="w-full bg-white border border-[#eadece] rounded-2xl px-5 py-3.5 text-sm outline-none focus:border-[#b3707b]" />
                </div>
              </div>
              <div>
                <label className="block text-xs uppercase tracking-wider text-[#666] mb-2 font-medium">Punto de Referencia (Opcional)</label>
                <input type="text" placeholder="Ej. Frente al parque, portería azul..." value={checkoutForm.reference} onChange={(e) => setCheckoutForm({ ...checkoutForm, reference: e.target.value })} className="w-full bg-white border border-[#eadece] rounded-2xl px-5 py-3.5 text-sm outline-none focus:border-[#b3707b]" />
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
                <div>
                  <label className="block text-xs uppercase tracking-wider text-[#666] mb-2 font-medium">Fecha de Entrega</label>
                  <input type="date" value={checkoutForm.deliveryDate} onChange={(e) => setCheckoutForm({ ...checkoutForm, deliveryDate: e.target.value })} className="w-full bg-white border border-[#eadece] rounded-2xl px-5 py-3.5 text-sm outline-none focus:border-[#b3707b]" />
                </div>
                <div>
                  <label className="block text-xs uppercase tracking-wider text-[#666] mb-2 font-medium">Franja Horaria</label>
                  <select value={checkoutForm.timeSlot} onChange={(e) => setCheckoutForm({ ...checkoutForm, timeSlot: e.target.value })} className="w-full bg-white border border-[#eadece] rounded-2xl px-5 py-3.5 text-sm outline-none focus:border-[#b3707b]">
                    <option value="Mañana (9:00 a.m. - 1:00 p.m.)">Mañana (9:00 a.m. - 1:00 p.m.)</option>
                    <option value="Tarde (2:00 p.m. - 6:00 p.m.)">Tarde (2:00 p.m. - 6:00 p.m.)</option>
                    <option value="Hora exacta acordada">Hora exacta acordada</option>
                  </select>
                </div>
              </div>
              <div>
                <label className="block text-xs uppercase tracking-wider text-[#666] mb-2 font-medium">Método de Pago</label>
                <select value={checkoutForm.paymentMethod} disabled className="w-full bg-[#faf8f6] border border-[#eadece] rounded-2xl px-5 py-3.5 text-sm outline-none font-medium text-[#1a1a1a] cursor-not-allowed">
                  <option value={`Nequi (${CONFIG.NEQUI_NUMBER})`}>Nequi ({CONFIG.NEQUI_NUMBER})</option>
                </select>
                <p className="text-[11px] text-[#888] mt-1.5">Pago coordinado directamente mediante transferencia a Nequi ({CONFIG.NEQUI_NUMBER}) o WhatsApp.</p>
              </div>
              <div>
                <label className="block text-xs uppercase tracking-wider text-[#666] mb-2 font-medium">Nota adicional (Opcional)</label>
                <textarea rows="2" placeholder="Instrucciones para el repartidor..." value={checkoutForm.note} onChange={(e) => setCheckoutForm({ ...checkoutForm, note: e.target.value })} className="w-full bg-white border border-[#eadece] rounded-2xl p-4 text-sm outline-none focus:border-[#b3707b]"></textarea>
              </div>
              <div className="pt-4">
                <button type="submit" className="w-full bg-[#25D366] hover:bg-[#20ba5a] text-white py-4 rounded-2xl text-xs uppercase tracking-[0.25em] font-medium shadow-xl transition-all flex items-center justify-center gap-3 cursor-pointer">
                  <Icon name="whatsapp" className="w-5 h-5" />
                  Enviar pedido por WhatsApp ({CONFIG.WHATSAPP_DISPLAY})
                </button>
              </div>
            </form>
          </div>
        </div>
      )}

      <a href={`https://wa.me/${CONFIG.WHATSAPP_NUMBER}?text=Hola%20${CONFIG.BUSINESS_NAME},%20quiero%20más%20información%20sobre%20sus%20productos%20en%20Rionegro`} target="_blank" rel="noopener noreferrer" className="fixed bottom-6 right-6 z-40 bg-[#25D366] hover:bg-[#20ba5a] text-white p-4 rounded-full shadow-2xl transition-all transform hover:scale-110 flex items-center justify-center" aria-label="WhatsApp">
        <Icon name="whatsapp" className="w-7 h-7" />
      </a>

      <footer className="bg-[#181818] text-[#f4f1ea] pt-20 pb-12 mt-28 border-t border-[#2a2a2a]">
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid grid-cols-1 md:grid-cols-4 gap-12 pb-16 border-t border-[#2a2a2a] pt-12">
          <div className="space-y-4">
            <h3 className="font-serif text-2xl tracking-wider">{CONFIG.BUSINESS_NAME}</h3>
            <p className="text-xs text-[#aaa] font-light leading-relaxed">{CONFIG.TAGLINE} Regalos románticos, rosas eternas y bolsos de perlas de alta gama.</p>
            <p className="text-xs text-[#d4af37] font-medium">Envíos exclusivamente en {CONFIG.CITY}, {CONFIG.DEPARTMENT}, {CONFIG.COUNTRY}.</p>
          </div>
          <div className="space-y-3">
            <h4 className="font-semibold text-xs tracking-[0.2em] uppercase text-white">Navegación</h4>
            <ul className="space-y-2.5 text-xs text-[#aaa] font-light">
              <li><button onClick={() => setActiveTab('home')} className="hover:text-white transition-colors">Inicio</button></li>
              <li><button onClick={() => { setActiveTab('catalog'); setSelectedCategory('rosas'); }} className="hover:text-white transition-colors">Rosas</button></li>
              <li><button onClick={() => { setActiveTab('catalog'); setSelectedCategory('bolsos'); }} className="hover:text-white transition-colors">Bolsos de Perlas</button></li>
              <li><button onClick={() => setActiveTab('about')} className="hover:text-white transition-colors">Nosotros</button></li>
            </ul>
          </div>
          <div className="space-y-3">
            <h4 className="font-semibold text-xs tracking-[0.2em] uppercase text-white">Información & Contacto</h4>
            <ul className="space-y-2.5 text-xs text-[#aaa] font-light">
              <li><button onClick={() => setActiveTab('shipping')} className="hover:text-white transition-colors">Envíos en {CONFIG.CITY}</button></li>
              <li><span className="text-white">Horario:</span> {CONFIG.BUSINESS_HOURS}</li>
              <li><span className="text-white">WhatsApp:</span> {CONFIG.WHATSAPP_DISPLAY}</li>
              <li><span className="text-white">Email:</span> {CONFIG.EMAIL}</li>
              <li><span className="text-white">Instagram:</span> {CONFIG.INSTAGRAM_HANDLE}</li>
            </ul>
          </div>
          <div className="space-y-3">
            <h4 className="font-semibold text-xs tracking-[0.2em] uppercase text-white">Políticas</h4>
            <ul className="space-y-2.5 text-xs text-[#aaa] font-light">
              <li>Política de Privacidad</li>
              <li>Términos y Condiciones</li>
              <li>Garantía de Frescura</li>
            </ul>
          </div>
        </div>
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-8 flex flex-col sm:flex-row items-center justify-between text-xs text-[#888] font-light border-t border-[#2a2a2a]">
          <p>© {new Date().getFullYear()} {CONFIG.BUSINESS_NAME}. Todos los derechos reservados.</p>
          <p className="mt-2 sm:mt-0">{CONFIG.TAGLINE} | {CONFIG.CITY}, {CONFIG.DEPARTMENT} 🌸</p>
        </div>
      </footer>
    </div>
  );
}

function AppWrapper() {
  return (<ErrorBoundary><App /></ErrorBoundary>);
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<AppWrapper />);
</script>
</body>
</html>
